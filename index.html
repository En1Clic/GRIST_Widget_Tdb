<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Politique de sécurité embarquée : rien ne se charge ni ne part hors du domaine du widget.
       connect-src 'self' sert uniquement au jeu de démonstration (demo/actions-demo.json).
       Les échanges avec Grist passent par postMessage, que la CSP ne bloque pas. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>Pilotage des actions — widget Grist</title>
  <link rel="stylesheet" href="src/styles.css?v=20261118-1056" />
  <script src="vendor/grist-plugin-api.js?v=20261118-1056"></script>
  <script src="vendor/echarts.min.js?v=20261118-1056"></script>
</head>
<body>
  <div id="app"><div class="empty">Chargement…</div></div>
  <script type="module" src="src/app.js?v=20261118-1056"></script>
</body>
</html>
